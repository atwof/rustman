[package]
name = "rustman"
version = "0.3.14"
edition = "2024"
description = "Rustman — pure-Rust native API testing tool built with iced"
authors = ["animeshchaudhri"]

[[bin]]
name = "rustman"
path = "src/main.rs"

[dependencies]
# GUI
iced = { version = "0.14", features = ["tokio", "advanced", "image", "svg"] }
iced_core = "0.14"
# Glyph advances for label overflow prediction (see ui/tree_label.rs)
ttf-parser = "0.25"
# Full-featured code editor widget (line numbers, syntect highlight, selection, undo)
iced-code-editor = "0.3.11"
image = { version = "0.25", default-features = false, features = ["png"] }

# HTTP
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "form",
    "cookies",
    "multipart",
    "stream",
    "rustls",
    "rustls-native-certs",
] }

# Async runtime (trimmed: task/select/sync/fs only — net, io, signal and
# process come transitively only if someone actually needs them)
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "fs"] }
# Cooperative cancellation for background jobs (CancellationToken)
tokio-util = "0.7"

# WebSocket
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"

# Storage
rusqlite = { version = "0.39", features = ["bundled"] }

# Git VCS for collections
git2 = { version = "0.21", features = ["vendored-libgit2", "vendored-openssl"] }

# Crypto (for JWT auth helper)
base64 = "0.23"
sha2 = "0.11"
hmac = "0.13"

# LRU cache for parsed response bodies
lru = "0.18"

# In-app self-update: reuses the existing (ring-based) reqwest to fetch a release
# asset, then extracts + atomically swaps the binary. All pure-Rust, no C toolchain.
self-replace = "1"
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }

# Misc
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
open = "5"
rfd = "0.17"

# Response preview: spreadsheet (pure Rust), PDF (native pdfium, auto-fetched
# binary), and HTML (native OS webview embedded as a child window)
calamine = "0.36"
wry = { version = "0.55", optional = true }
pdfium-render = { version = "0.9", features = ["thread_safe"] }
pdfium-bundled = "0.1"

# Pre-request/test scripting language (see vendor/rustman-engine)
rustman-engine = { path = "vendor/rustman-engine" }
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs"] }

[patch.crates-io]
iced-code-editor = { path = "vendor/iced-code-editor" }

[features]
default = ["webview"]
# Native OS HTML preview (WebKitGTK on Linux, WebView2 on Windows, WKWebView
# on macOS). Disable for a WebKit-free build (`--no-default-features`) that
# runs anywhere at the cost of rendered HTML previews — those fall back to a
# built-in readable-text rendering instead.
webview = ["dep:wry"]

[profile.release]
opt-level = 'z'
strip = true
lto = true
codegen-units = 1
panic = "abort"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
